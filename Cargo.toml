[package]
name = "wikigraph"
version = "0.1.0"
edition = "2021"
description = "English Wikipedia link graph: dump ingestion, mmap'd CSR store, HTTP API"
license = "MIT"

[dependencies]
anyhow = "1"
axum-prometheus = "0.9"
axum = "0.8"
flate2 = { version = "1", features = ["zlib-rs"], default-features = false }
memchr = "2"
memmap2 = "0.9"
png = "0.18"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.6", features = ["cors", "fs", "compression-gzip", "set-header"] }

[profile.release]
lto = "thin"

[[bin]]
name = "ingest"
path = "src/bin/ingest.rs"

[[bin]]
name = "serve"
path = "src/bin/serve.rs"

[[bin]]
name = "atlas"
path = "src/bin/atlas.rs"

[[bin]]
name = "render"
path = "src/bin/render.rs"
