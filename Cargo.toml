[package]
name = "wikigraph"
version = "0.1.0"
edition = "2021"
description = "English Wikipedia link graph: dump ingestion, mmap'd CSR store, HTTP API"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
flate2 = { version = "1", features = ["zlib-rs"], default-features = false }
memchr = "2"
memmap2 = "0.9"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.6", features = ["cors"] }

[profile.release]
lto = "thin"

[[bin]]
name = "ingest"
path = "src/bin/ingest.rs"

[[bin]]
name = "serve"
path = "src/bin/serve.rs"
